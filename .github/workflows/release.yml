name: OpenAPU Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj

      - name: Restore
        run: dotnet restore OpenAPU.sln

      - name: Build
        run: dotnet build OpenAPU.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test OpenAPU.sln --configuration Release --no-build

  package:
    name: Package ${{ matrix.runtime }}
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 15

    strategy:
      matrix:
        runtime:
          - win-x64
          - linux-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Resolve version
        id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Publish
        run: >
          dotnet publish
          src/OpenAPU.Api/OpenAPU.Api.csproj
          --configuration Release
          --runtime ${{ matrix.runtime }}
          --self-contained false
          -p:Version=${{ steps.version.outputs.value }}
          --output publish/${{ matrix.runtime }}

      - name: Include documentation
        shell: bash
        run: |
          cp README.md publish/${{ matrix.runtime }}/
          cp RELEASE_NOTES.md publish/${{ matrix.runtime }}/
          cp compose.yaml publish/${{ matrix.runtime }}/

      - name: Create archive
        shell: bash
        run: |
          cd publish/${{ matrix.runtime }}
          zip -r "../OpenAPU-${{ github.ref_name }}-${{ matrix.runtime }}.zip" .

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenAPU-${{ github.ref_name }}-${{ matrix.runtime }}
          path: publish/OpenAPU-${{ github.ref_name }}-${{ matrix.runtime }}.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - verify
      - package
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download packages
        uses: actions/download-artifact@v5
        with:
          pattern: OpenAPU-${{ github.ref_name }}-*
          merge-multiple: true
          path: release-assets

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          name: OpenAPU ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: release-assets/*.zip
          fail_on_unmatched_files: true
          generate_release_notes: true


