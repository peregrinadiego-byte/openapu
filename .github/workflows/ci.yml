name: OpenAPU CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openapu-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj

      - name: Restore dependencies
        run: dotnet restore OpenAPU.sln

      - name: Build
        run: dotnet build OpenAPU.sln --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test OpenAPU.sln
          --configuration Release
          --no-build
          --logger "trx;LogFileName=openapu-tests.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: openapu-test-results
          path: TestResults/**/*.trx
          if-no-files-found: error
          retention-days: 14

  docker:
    name: Validate Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build --tag openapu:ci .

      - name: Start container
        run: >
          docker run
          --detach
          --name openapu-ci
          --publish 8080:8080
          --env ASPNETCORE_URLS=http://+:8080
          --env OPENAPU_DB_PATH=/data/openapu.db
          openapu:ci

      - name: Wait for health endpoint
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8080/ready > /dev/null; then
              exit 0
            fi

            sleep 2
          done

          docker logs openapu-ci
          exit 1

      - name: Verify version endpoint
        run: |
          response="$(curl --fail --silent http://localhost:8080/)"

          echo "$response" | grep '"name":"OpenAPU"'
          echo "$response" | grep '"version":"1.4.0"'
          echo "$response" | grep '"status":"ready"'

      - name: Verify system status
        run: |
          response="$(curl --fail --silent http://localhost:8080/system/status)"

          echo "$response" | grep '"database":"ready"'
          echo "$response" | grep '"version":"1.4.0"'

      - name: Show container logs on failure
        if: failure()
        run: docker logs openapu-ci

      - name: Stop container
        if: always()
        run: docker rm --force openapu-ci || true




